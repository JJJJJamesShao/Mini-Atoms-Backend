name: Deploy to Aliyun ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 前置条件：ECS 上已克隆仓库到 /root/proj/Mini-Atoms-Backend，且已安装 node 与 pm2；
      # 仓库 Settings → Secrets 中已配置 ECS_IP / ECS_USER / ECS_PASSWORD。
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ECS_IP }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd /root/proj/Mini-Atoms-Backend
            git pull origin main
            npm install
            npm run build
            npm run db:migrate
            pm2 restart mini-atoms || pm2 start dist/index.js --name mini-atoms
